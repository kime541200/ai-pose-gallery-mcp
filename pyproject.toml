[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-pose-gallery-mcp"
version = "0.1.0"
description = "MCP server for searching ai-pose-gallery-zh (poses, costumes, portraits) and preparing ComfyUI multi-reference workflows."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.6.0",
    "httpx>=0.27.0",
    "pillow>=10.0.0",
    "opencc-python-reimplemented>=0.1.7",
]

[project.scripts]
ai-pose-gallery-mcp = "ai_pose_gallery_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_pose_gallery_mcp"]
